name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild so the published inflation data stays current (Mondays 03:17 UTC).
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    # Publishes the static app to GitHub Pages. Only from main, only after tests pass.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (app, rules pack, schemas, examples only)
        run: |
          mkdir _site
          cp -r index.html src rules schemas examples _site/
          touch _site/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch public inflation data (best effort; the app works without it)
        continue-on-error: true
        run: node scripts/fetch-market-data.mjs _site/market/india.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
